<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机自检 · Immersive Cinema</title><link rel="stylesheet" href="../css/main.css"><style>body{padding:40px 5vw;max-width:1100px;margin:auto}h1{font-size:30px;font-weight:400}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}canvas{width:100%;aspect-ratio:16/9;border:1px solid var(--border);border-radius:12px;background:#080b10;display:block}#results{font:12px/2 monospace;color:#b4c6b6;white-space:pre-wrap;padding:20px;background:#14171b;border:1px solid var(--border);border-radius:10px}.note{font-size:12px;color:var(--muted)}</style></head><body><span class="eyebrow">LOCAL DEVICE DIAGNOSTICS</span><h1>在你的设备上，检查影院。</h1><p class="note">点击后播放内置短片并验证 WebGL2、实际视频纹理、SSAO / Bloom、Web Audio 和 IndexedDB。不会上传影片或读取其他文件。逻辑回归测试见项目 tests/core-tests.mjs。</p><nav><button id="run" class="primary-button">开始本机自检</button><button id="pointer" class="secondary-button">测试鼠标锁定（3 秒）</button><button id="full" class="secondary-button">测试全屏</button><a class="secondary-button" href="../index.html">进入影院</a></nav><canvas id="test-canvas" aria-label="影院 WebGL 测试画面"></canvas><pre id="results">等待点击。完整的 60 秒入场、按键和散场流程，请同时按照 README 的验收步骤检查。</pre><script type="module" src="./browser-tests.js"></script></body></html>
